
name: Playwright BDD CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: playwright-bdd-framework/package-lock.json

      # Step 3: Install dependencies
      - name: Install dependencies
        working-directory: playwright-bdd-framework
        run: npm ci

      # Step 4: Install Playwright browsers
      - name: Install Playwright browsers
        working-directory: playwright-bdd-framework
        run: npx playwright install --with-deps chromium

      # Step 5: TypeScript validation
      - name: TypeScript typecheck
        working-directory: playwright-bdd-framework
        run: npm run typecheck

      # Step 6: Execute Cucumber BDD tests
      - name: Run BDD tests
        working-directory: playwright-bdd-framework
        run: npm run test:bdd

      # Step 7: Upload test reports
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-bdd-reports
          path: |
            playwright-bdd-framework/reports/
            playwright-bdd-framework/screenshots/
          if-no-files-found: ignore
          retention-days: 30
