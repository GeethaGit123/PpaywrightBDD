
name: Playwright BDD CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: playwright-bdd-framework/package-lock.json

      # Step 3: Install dependencies
      - name: Install dependencies
        working-directory: playwright-bdd-framework
        run: npm ci

      # Step 4: Install Playwright browsers
      - name: Install Playwright browsers
        working-directory: playwright-bdd-framework
        run: npx playwright install --with-deps chromium

      # Step 5: TypeScript validation
      - name: TypeScript typecheck
        working-directory: playwright-bdd-framework
        run: npm run typecheck

      - name: Create QA environment file
        working-directory: playwright-bdd-framework
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const values = {
            BASE_URL: process.env.BASE_URL,
            USERNAME: process.env.USERNAME,
            PASSWORD: process.env.PASSWORD,
          };
          const secretNames = {
            BASE_URL: "BASE_URL",
            USERNAME: "USERNAME",
            PASSWORD: "PASSWORD",
          };
          const missing = Object.entries(values)
            .filter(([, value]) => !value)
            .map(([name]) => secretNames[name]);
          if (missing.length) {
            throw new Error(`Missing GitHub Actions secrets: ${missing.join(", ")}`);
          }
          const contents = Object.entries(values)
            .map(([name, value]) => `${name}=${JSON.stringify(value)}`)
            .join("\n");
          fs.writeFileSync("config/.env.qa", `${contents}\n`, { mode: 0o600 });
          NODE

      # Step 6: Execute Cucumber BDD tests
      - name: Run BDD tests
        env:
          TEST_ENV: qa
        working-directory: playwright-bdd-framework
        run: npm run test:bdd

      # Step 7: Upload test reports
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-bdd-reports
          path: |
            playwright-bdd-framework/reports/
            playwright-bdd-framework/screenshots/
          if-no-files-found: ignore
          retention-days: 30
